<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متاجر إلكترونية احترافية — Creative Code</title>
  <meta name="description" content="نبني متاجر إلكترونية احترافية على Shopify وWooCommerce والمخصص — تصميم عصري وتجربة مستخدم استثنائية" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --emerald: #10B981;
      --emerald-dark: #059669;
      --emerald-faint: rgba(16,185,129,0.08);
      --amber: #F59E0B;
      --amber-faint: rgba(245,158,11,0.08);
      --blue: #0EA5E9;
      --purple: #8B5CF6;
      --navy: #0F172A;
      --navy2: #1E293B;
      --navy3: #334155;
      --text: #F1F5F9;
      --text-muted: rgba(241,245,249,0.55);
      --border: rgba(255,255,255,0.07);
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.25);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--navy);
      color: var(--text);
      direction: rtl;
      overflow-x: hidden;
    }

    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

    /* SECTION COMMONS */
    .section-header { margin-bottom: 56px; }
    .section-header.centered { text-align: center; }

    .section-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 100px;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
      background: var(--emerald-faint);
      border: 1px solid rgba(16,185,129,0.25);
      color: var(--emerald);
    }

    .section-title {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 900;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .section-title span { color: var(--emerald); }
    .section-sub { font-size: 1rem; color: var(--text-muted); line-height: 1.7; max-width: 600px; }
    .section-header.centered .section-sub { margin: 0 auto; }

    /* ANIMATIONS */
    .fade-up { opacity: 0; transform: translateY(28px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    /* ===== NAV ===== */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 16px 0;
      background: rgba(15,23,42,0.7);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .nav-logo {
      font-size: 1.05rem;
      font-weight: 900;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--emerald), var(--blue));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--emerald); }

    .nav-cta {
      background: linear-gradient(135deg, var(--emerald), #0EA5E9);
      color: white !important;
      padding: 9px 22px;
      border-radius: 8px;
      font-weight: 700 !important;
      font-size: 0.82rem !important;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 0 80px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(16,185,129,0.12) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 90% 50%, rgba(14,165,233,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse 40% 60% at 10% 80%, rgba(139,92,246,0.06) 0%, transparent 60%),
                  var(--navy);
    }

    .hero-grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6EE7B7;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 100px;
      margin-bottom: 24px;
      letter-spacing: 0.03em;
      width: fit-content;
    }

    .hero-headline {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .hero-headline .line1 { display: block; color: var(--text); }
    .hero-headline .line2 {
      display: block;
      background: linear-gradient(135deg, var(--emerald) 0%, var(--blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.75;
      margin-bottom: 36px;
      max-width: 480px;
    }

    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 40px; }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--emerald), var(--blue));
      color: white;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      font-family: inherit;
      box-shadow: 0 8px 32px rgba(16,185,129,0.3);
    }

    .btn-primary:hover { opacity: 0.88; transform: translateY(-2px); }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-ghost:hover { border-color: var(--emerald); color: var(--emerald); }

    .hero-floating-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hfb {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Hero visual */
    .hero-visual { position: relative; display: flex; justify-content: center; align-items: center; }

    .store-mockup {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
    }

    .mockup-browser-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .mockup-dot { width: 10px; height: 10px; border-radius: 50%; }
    .mockup-url {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      height: 22px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.25);
    }

    .mockup-body { padding: 16px; }

    .mockup-hero-img {
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(14,165,233,0.1));
      border-radius: 10px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 2.5rem;
      border: 1px solid rgba(16,185,129,0.15);
    }

    .mockup-product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .mockup-product {
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .mp-img { height: 36px; border-radius: 5px; margin-bottom: 5px; }
    .mp-line { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.06); margin-bottom: 3px; }
    .mp-price { height: 6px; width: 40%; border-radius: 3px; background: rgba(16,185,129,0.3); }

    .mockup-btn {
      background: linear-gradient(90deg, var(--emerald), var(--blue));
      border-radius: 8px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: white;
      font-weight: 700;
    }

    .hero-badge-float {
      position: absolute;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .hbf-top { top: -10px; left: -20px; }
    .hbf-bottom { bottom: 20px; left: -30px; }

    .hbf-icon { font-size: 1.2rem; }
    .hbf-text { font-size: 0.68rem; font-weight: 700; color: white; }
    .hbf-sub { font-size: 0.58rem; color: var(--text-muted); }

    @media (max-width: 900px) {
      .hero-inner { grid-template-columns: 1fr; text-align: center; }
      .hero-badge { margin: 0 auto 24px; }
      .hero-sub { margin: 0 auto 36px; }
      .hero-btns { justify-content: center; }
      .hero-floating-badges { justify-content: center; }
      .hero-visual { display: none; }
    }

    /* ===== STATS BAR ===== */
    .stats-bar {
      background: rgba(255,255,255,0.02);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 32px 0;
    }

    .stats-inner {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 24px;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .stat-item { text-align: center; }
    .stat-num {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--emerald), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }

    /* ===== SERVICES ===== */
    .services-section { padding: 100px 0; }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .service-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      transition: all 0.3s;
      cursor: default;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .service-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.12);
      box-shadow: 0 20px 48px rgba(0,0,0,0.3);
    }

    .service-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .service-title { font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .service-subtitle { font-size: 0.75rem; font-weight: 600; margin-bottom: 12px; opacity: 0.7; }
    .service-desc { font-size: 0.83rem; color: var(--text-muted); line-height: 1.65; margin-bottom: 16px; }

    .service-features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sf-tag {
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px;
      padding: 4px 10px;
      color: var(--text-muted);
    }

    /* ===== WHY US ===== */
    .why-section {
      padding: 100px 0;
      background: rgba(255,255,255,0.015);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .why-card {
      display: flex;
      gap: 16px;
      padding: 24px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: all 0.25s;
    }

    .why-card:hover { border-color: rgba(16,185,129,0.2); background: rgba(16,185,129,0.03); }

    .why-icon {
      width: 44px;
      height: 44px;
      background: var(--emerald-faint);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--emerald);
    }

    .why-title { font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .why-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; }

    /* ===== PROCESS ===== */
    .process-section { padding: 100px 0; }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0;
      position: relative;
    }

    .process-grid::before {
      content: '';
      position: absolute;
      top: 40px;
      right: 12.5%;
      left: 12.5%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(16,185,129,0.3), rgba(14,165,233,0.3), transparent);
    }

    .process-step {
      padding: 0 16px;
      text-align: center;
      position: relative;
    }

    .process-num-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .process-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(14,165,233,0.1));
      border: 1px solid rgba(16,185,129,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--emerald);
      position: relative;
      z-index: 1;
    }

    .process-num {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--emerald), var(--blue));
      border-radius: 50%;
      font-size: 0.6rem;
      font-weight: 900;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .process-duration {
      display: inline-block;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      color: var(--amber);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 100px;
      margin-bottom: 12px;
    }

    .process-title { font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .process-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.65; }

    @media (max-width: 700px) {
      .process-grid { grid-template-columns: 1fr 1fr; }
      .process-grid::before { display: none; }
    }

    @media (max-width: 480px) {
      .process-grid { grid-template-columns: 1fr; }
    }

    /* ===== PRICING ===== */
    .pricing-section { padding: 100px 0; background: rgba(255,255,255,0.015); border-top: 1px solid var(--border); }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .price-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      position: relative;
      transition: all 0.3s;
    }

    .price-card.popular {
      border-color: rgba(139,92,246,0.4);
      background: rgba(139,92,246,0.04);
      box-shadow: 0 0 40px rgba(139,92,246,0.1);
    }

    .price-card:hover { transform: translateY(-4px); }

    .popular-badge {
      position: absolute;
      top: -14px;
      right: 28px;
      background: linear-gradient(90deg, var(--purple), var(--blue));
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 100px;
    }

    .price-plan-name { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .price-plan-ar { font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 20px; }

    .price-amount {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      margin-bottom: 6px;
    }

    .price-currency { font-size: 1.1rem; font-weight: 700; padding-top: 4px; }
    .price-num { font-size: 3.2rem; font-weight: 900; line-height: 1; }
    .price-period { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }

    .price-duration {
      display: inline-block;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      color: var(--amber);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 100px;
      margin-bottom: 24px;
    }

    .price-divider { height: 1px; background: var(--border); margin-bottom: 20px; }

    .price-includes { list-style: none; margin-bottom: 28px; }
    .price-includes li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .price-includes li:last-child { border-bottom: none; }

    .pi-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pi-x {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(239,68,68,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .price-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 14px 18px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }

    .price-cta:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.12); }
    .price-cta-text { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .price-cta-arrow { color: var(--text-muted); transition: transform 0.2s; }
    .price-cta:hover .price-cta-arrow { transform: translateX(-4px); }

    .price-cta.popular-cta {
      background: linear-gradient(135deg, var(--purple), var(--blue));
      border-color: transparent;
    }

    .price-cta.popular-cta:hover { opacity: 0.88; }

    .pricing-note-wrap {
      text-align: center;
      padding: 16px 24px;
      background: rgba(245,158,11,0.05);
      border: 1px solid rgba(245,158,11,0.15);
      border-radius: 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 700px;
      margin: 0 auto;
    }

    .pricing-note-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
    .pricing-note-text { font-size: 0.82rem; color: rgba(245,158,11,0.8); line-height: 1.6; text-align: right; }

    /* ===== FAQ ===== */
    .faq-section { padding: 100px 0; }

    .faq-list { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    .faq-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .faq-item.open { border-color: rgba(16,185,129,0.2); }

    .faq-q {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
      gap: 12px;
      user-select: none;
    }

    .faq-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);

      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: all 0.3s;
    }

    .faq-item.open .faq-icon { background: rgba(16,185,129,0.15); color: var(--emerald); transform: rotate(45deg); }

    .faq-a {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s;
    }

    .faq-item.open .faq-a { max-height: 200px; }

    .faq-a-inner {
      padding: 0 24px 20px;
      font-size: 0.85rem;

      border-radius: 24px;
      margin-bottom: 60px;
      position: relative;
      overflow: hidden;
    }

    .footer-cta::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
      top: -100px;
      right: -50px;
      pointer-events: none;
    }

    .footer-cta-badge {
      display: inline-flex;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.2);
      color: var(--emerald);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    .footer-cta h2 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900; color: var(--text); margin-bottom: 12px; }
    .footer-cta p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 32px; }

    .footer-cta-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

    .btn-footer-main {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--emerald), var(--blue));
      color: white; font-weight: 700; font-size: 0.9rem;
      padding: 13px 30px; border-radius: 10px; text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-footer-main:hover { opacity: 0.88; }

    .btn-footer-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); font-weight: 600; font-size: 0.9rem;
      padding: 13px 28px; border-radius: 10px; text-decoration: none;
      transition: all 0.2s;
    }

    .btn-footer-ghost:hover { border-color: var(--emerald); color: var(--emerald); }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 48px;
    }

    .footer-col h3 { font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .footer-col > p { font-size: 0.82rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 0; }

    .footer-col ul { list-style: none; }

    .footer-badge {

    @media (max-width: 768px) {

      .pricing-grid { grid-template-columns: 1fr; }
      .why-grid { grid-template-columns: 1fr; }
    }

    @media print {
      nav { display: none; }
    }
  </style>
</head>

<script>
const c = EC_CONFIG;
const L = c.labels;
const cc = c.company;

// ===== HELPERS =====
function svg(inner, size = 20, color = 'currentColor') {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

// ===== FADE UP OBSERVER =====
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1 });

document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

// ===== NAV =====
document.getElementById('nav-brand').textContent = cc.nameAr;

const navItems = [
  { label: L.nav.services, href: '#services' },
  { label: L.nav.whyUs,    href: '#why' },
  { label: L.nav.process,  href: '#process' },
  { label: L.nav.pricing,  href: '#pricing' },
  { label: L.nav.contact,  href: '#footer', cls: 'nav-cta' }
];

document.getElementById('nav-links').innerHTML = navItems.map(n =>
  `<li><a href="${n.href}" class="${n.cls || ''}">${n.label}</a></li>`
).join('');

// ===== HERO =====
document.getElementById('hero-badge').textContent = c.hero.badge;
document.getElementById('hero-line1').textContent = c.hero.headline;
document.getElementById('hero-line2').textContent = c.hero.headlineHighlight;
document.getElementById('hero-sub').textContent = c.hero.sub;

document.getElementById('hero-btns').innerHTML = `
  <a href="#pricing" class="btn-primary">
    ${svg('<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>', 18)}
    ${c.hero.cta}
  </a>
  <a href="tel:${cc.phone}" class="btn-ghost">
    ${svg('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.42 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>', 18)}
    ${c.hero.ctaSecondary}
  </a>`;

document.getElementById('hero-badges').innerHTML =
  [c.hero.floatingBadge1, c.hero.floatingBadge2, c.hero.floatingBadge3]
    .map(b => `<span class="hfb">${b}</span>`).join('');

// Mockup
document.getElementById('mockup-products').innerHTML = [1,2,3].map(i => `
  <div class="mockup-product">
    <div class="mp-img" style="background:linear-gradient(135deg,rgba(16,185,129,0.1${i}),rgba(14,165,233,0.0${i+3}));border-radius:5px;"></div>
    <div class="mp-line"></div>
    <div class="mp-line" style="width:60%"></div>
    <div class="mp-price"></div>
  </div>`).join('');

document.getElementById('mockup-cta').textContent = c.hero.cta;

document.getElementById('float-badge-1').innerHTML = `
  <div class="hbf-icon">🔒</div>
  <div><div class="hbf-text">دفع آمن</div><div class="hbf-sub">SSL & PCI DSS</div></div>`;

document.getElementById('float-badge-2').innerHTML = `
  <div class="hbf-icon">📱</div>
  <div><div class="hbf-text">متوافق موبايل</div><div class="hbf-sub">iOS & Android</div></div>`;

// ===== STATS =====
document.getElementById('stats-inner').innerHTML = c.stats.map(s => `
  <div class="stat-item fade-up">
    <div class="stat-num">${s.num}</div>
    <div class="stat-label">${s.label}</div>
  </div>`).join('');

document.querySelectorAll('.stat-item.fade-up').forEach(el => observer.observe(el));

// ===== SERVICES =====
document.getElementById('services-badge').textContent = L.sections.services;
document.getElementById('services-title').innerHTML = 'خدماتنا في <span>التجارة الإلكترونية</span>';
document.getElementById('services-sub').textContent = 'من المتاجر الجاهزة إلى الحلول المخصصة بالكامل — عندنا الحل المناسب لكل مشروع';

document.getElementById('services-grid').innerHTML = c.services.map((s, i) => `
  <div class="service-card fade-up" style="transition-delay:${i * 0.07}s">
    <div class="service-icon" style="background:${s.colorBg}; color:${s.color}">
      ${svg(s.svg, 24, s.color)}
    </div>
    <div class="service-title">${s.title}</div>
    <div class="service-subtitle" style="color:${s.color}">${s.subtitle}</div>

      ${s.features.map(f => `<span class="sf-tag">${f}</span>`).join('')}
    </div>
  </div>`).join('');

document.querySelectorAll('.service-card.fade-up').forEach(el => observer.observe(el));

// ===== WHY US =====
document.getElementById('why-badge').textContent = L.sections.whyUs;

document.getElementById('why-grid').innerHTML = c.whyUs.map((w, i) => `
  <div class="why-card fade-up" style="transition-delay:${i * 0.07}s">
    <div class="why-icon">${svg(w.svg, 20)}</div>

      <div class="why-title">${w.title}</div>
      <div class="why-desc">${w.desc}</div>

  </div>`).join('');

document.querySelectorAll('.why-card.fade-up').forEach(el => observer.observe(el));

// ===== PROCESS =====
document.getElementById('process-badge').textContent = L.sections.process;
document.getElementById('process-title').innerHTML = 'من الفكرة إلى <span>المتجر الجاهز</span>';
document.getElementById('process-sub').textContent = '4 خطوات واضحة — نلتزم فيها بالجودة والمواعيد بدون استثناء';

document.getElementById('process-grid').innerHTML = c.process.map((p, i) => `
  <div class="process-step fade-up" style="transition-delay:${i * 0.1}s">
    <div class="process-num-wrap">
      <div class="process-circle">${svg(p.svg, 28)}</div>
      <div class="process-num">${p.num}</div>
    </div>
    <div class="process-duration">${p.duration}</div>
    <div class="process-title">${p.title}</div>
    <div class="process-desc">${p.desc}</div>
  </div>`).join('');

document.querySelectorAll('.process-step.fade-up').forEach(el => observer.observe(el));

// ===== PRICING =====
document.getElementById('pricing-badge').textContent = L.sections.pricing;
document.getElementById('pricing-title').textContent = c.pricing.title;
document.getElementById('pricing-sub').textContent = c.pricing.subtitle;
document.getElementById('pricing-note').textContent = L.pricingNote;

const checkSvg = (color) => `
  <span class="pi-check" style="background:rgba(${color},0.12)">
    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgb(${color})" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </span>`;

const xSvg = `
  <span class="pi-x">
    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </span>`;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

document.getElementById('pricing-grid').innerHTML = c.pricing.plans.map(p => `
  <div class="price-card ${p.popular ? 'popular' : ''} fade-up">
    ${p.popular ? `<div class="popular-badge">${L.pricingPopular}</div>` : ''}
    <div class="price-plan-name">${p.name}</div>
    <div class="price-plan-ar">${p.nameAr}</div>
    <div class="price-amount">
      <span class="price-currency" style="color:${p.color}">${p.currency}</span>
      <span class="price-num" style="color:${p.color}">${p.price}</span>
    </div>
    <div class="price-period">${L.pricingPeriod}</div>
    <div class="price-duration">⏱ ${p.duration}</div>
    <div class="price-divider"></div>
    <ul class="price-includes">
      ${p.includes.map(item => `<li>${checkSvg(hexToRgb(p.color))}<span>${item}</span></li>`).join('')}
      ${p.notIncludes.map(item => `<li>${xSvg}<span style="text-decoration:line-through;opacity:0.4">${item}</span></li>`).join('')}
    </ul>
    <a href="tel:${cc.phone}" class="price-cta ${p.popular ? 'popular-cta' : ''}">
      <span class="price-cta-text">${L.pricingCta}</span>
      <span class="price-cta-arrow">${svg('<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>', 16)}</span>
    </a>
  </div>`).join('');

document.querySelectorAll('.price-card.fade-up').forEach(el => observer.observe(el));

// ===== FAQ =====
document.getElementById('faq-badge').textContent = L.sections.faq;
document.getElementById('faq-title').innerHTML = 'أسئلة <span>شائعة</span>';

document.getElementById('faq-list').innerHTML = c.faq.map((item, i) => `
  <div class="faq-item" data-i="${i}">
    <div class="faq-q">
      <span>${item.q}</span>
      <span class="faq-icon">${svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 14)}</span>
    </div>
    <div class="faq-a">
      <div class="faq-a-inner">${item.a}</div>
    </div>
  </div>`).join('');

document.getElementById('faq-list').addEventListener('click', e => {
  const item = e.target.closest('.faq-item');
  if (!item) return;
  const isOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-item').forEach(el => el.classList.remove('open'));
  if (!isOpen) item.classList.add('open');
});

// ===== FOOTER =====
document.getElementById('footer-cta-badge').textContent = L.footerCtaBadge;
document.getElementById('footer-cta-title').textContent = L.footerCtaTitle;
document.getElementById('footer-cta-sub').textContent = L.footerCtaSub;
document.getElementById('footer-cta-btns').innerHTML = `
  <a href="tel:${cc.phone}" class="btn-footer-main">${c.footer.ctaBtnMain}</a>
  <a href="mailto:${cc.email}" class="btn-footer-ghost">${c.footer.ctaBtnSecondary}</a>`;

document.getElementById('footer-brand').textContent = cc.nameAr;
document.getElementById('footer-tagline').textContent = cc.tagline;
document.getElementById('footer-contact-title').textContent = c.footer.contactTitle;
document.getElementById('footer-contact').innerHTML = `
  <li>📞 ${cc.phone}</li>
  <li>✉ ${cc.email}</li>
  <li>🌐 ${cc.website}</li>
  <li>📍 ${cc.address}</li>`;

document.getElementById('footer-services-title').textContent = c.footer.servicesTitle;
document.getElementById('footer-services-list').innerHTML =
  c.footer.servicesList.map(s => `<li>→ ${s}</li>`).join('');

document.getElementById('footer-badge').textContent = L.footerBadge;
document.getElementById('footer-copy').textContent =
  `© ${new Date().getFullYear()} ${cc.nameAr} — ${L.footerRights}`;

// ===== FAQ title span fix =====
