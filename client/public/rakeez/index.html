<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>ركيز | دليل الواجهات</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:flex;flex-direction:column;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#0B1630;background:#EEF4FF}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid #DCE6F7}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5B9AF3,#1F6FEB);color:#fff;font-style:normal}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lab{font-size:.72rem;color:#6B7794;margin-inline-end:2px}
button,a.btn{font:inherit;font-size:.88rem;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid #CFDDF5;background:#fff;color:#27406B;cursor:pointer;text-decoration:none;transition:background .2s,color .2s}
button:hover,a.btn:hover{background:#EAF2FF}button[aria-pressed=true]{background:#1F6FEB;border-color:#1F6FEB;color:#fff}
.b2b{margin-inline-start:auto}.b2b button{border-color:#0F3A8A;color:#0F3A8A}.b2b button[aria-pressed=true]{background:#0F3A8A;color:#fff}
.sep{width:1px;height:26px;background:#DCE6F7}
iframe{flex:1;width:100%;border:0;background:#fff}
:focus-visible{outline:3px solid #1F6FEB;outline-offset:2px}
@media(max-width:700px){.b2b{margin-inline-start:0}.sep{display:none}}
</style></head><body>
<header>
  <div class="brand"><i>ر</i>دليل واجهات ركيز</div>
  <div class="grp" role="group" aria-label="أفراد (B2C)"><span class="lab">الأفراد B2C</span>
    <button data-k="customer" aria-pressed="true">تطبيق العميل</button><button data-k="technician" aria-pressed="false">تطبيق الفني</button><button data-k="admin" aria-pressed="false">لوحة التحكم</button><button data-k="web" aria-pressed="false">موقع العملاء</button></div>
  <div class="grp b2b" role="group" aria-label="الشركات (B2B)"><span class="lab">الشركات</span><button data-k="business" aria-pressed="false">نظام الشركات B2B</button></div>
  <a class="btn" id="full" href="interactive/customer-app/" target="_blank" rel="noopener">جرب التطبيق ↗</a>
</header>
<iframe id="f" title="المعرض" src="customer/"></iframe>
<script>
(function(){var f=document.getElementById('f'),full=document.getElementById('full'),bs=[].slice.call(document.querySelectorAll('button[data-k]'));
var TRY={customer:['customer-app','جرب التطبيق'],technician:['technician-app','جرب التطبيق'],admin:['admin','جرب اللوحة'],web:['customer-web','جرب الموقع'],business:['business','جرب النظام']};
function show(k){if(!document.querySelector('[data-k="'+k+'"]'))k='customer';bs.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.k===k))});var u=k+'/';if(f.getAttribute('src')!==u)f.setAttribute('src',u);var t=TRY[k];full.href='interactive/'+t[0]+'/';full.textContent=t[1]+' ↗';try{history.replaceState(null,'','#'+k)}catch(e){}}
bs.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.k)})});show((location.hash||'').slice(1)||'customer');})();
</script></body></html>

</body></html>
