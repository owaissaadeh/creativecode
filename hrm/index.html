<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trusted HRM — نظام إدارة الموارد البشرية الذكي</title>
  <meta name="description" content="نظام HRM متكامل بحضور ذكي مضاد لتزوير GPS، وضع أوف لاين كامل، وإدارة شاملة للموارد البشرية" />
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #7C3AED;
      --purple-light: #9333EA;
      --purple-dark: #5B21B6;
      --blue: #0EA5E9;
      --blue-dark: #0284C7;
      --green: #10B981;
      --red: #EF4444;
      --gold: #F59E0B;
      --purple-faint: #F5F3FF;
      --purple-mid: #EDE9FE;
      --text: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --bg: #FFFFFF;
      --bg-soft: #F8FAFC;
      --border: #E2E8F0;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 4px 24px rgba(15,23,42,0.06);
      --shadow-lg: 0 8px 48px rgba(15,23,42,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; right: 0; left: 0;
      z-index: 100;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(124,58,237,0.08);
      padding: 14px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: box-shadow 0.3s;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--purple);
    }

    .nav-logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .nav-pill {
      background: linear-gradient(135deg, var(--purple-mid), #DBEAFE);
      color: var(--purple);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 100px;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      background: linear-gradient(135deg, #0F0720 0%, #1E0B4D 35%, #2D1669 60%, #4C1D95 80%, #5B21B6 100%);
      display: flex;
      align-items: center;
      padding: 120px 48px 80px;
      position: relative;
      overflow: hidden;
      gap: 48px;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 30% 50%, rgba(14,165,233,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 20%, rgba(124,58,237,0.25) 0%, transparent 50%),
        radial-gradient(ellipse 40% 40% at 10% 80%, rgba(16,185,129,0.08) 0%, transparent 50%);
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .hero-dots { position: absolute; inset: 0; overflow: hidden; }
    .hero-dot {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.06; }
      50% { transform: translateY(-30px) scale(1.1); opacity: 0.12; }
    }

    .hero-left {
      flex: 1;
      position: relative;
      z-index: 2;
      max-width: 580px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #A5F3FC;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 100px;
      margin-bottom: 28px;
      backdrop-filter: blur(8px);
    }

    .hero-badge-dot {
      width: 8px; height: 8px;
      background: #34D399;
      border-radius: 50%;
      animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .hero h1 {
      font-size: clamp(2rem, 4.5vw, 3.5rem);
      font-weight: 900;
      color: white;
      line-height: 1.15;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .hero h1 .hl {
      background: linear-gradient(90deg, #38BDF8, #818CF8, #C4B5FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.65);
      margin-bottom: 36px;
      font-weight: 500;
      line-height: 1.75;
      max-width: 500px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }

    .btn-hero {
      background: linear-gradient(135deg, var(--blue), #0284C7);
      color: white;
      padding: 13px 30px;
      border-radius: 100px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(14,165,233,0.4);
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
    }

    .btn-hero:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(14,165,233,0.5); }

    .btn-hero-outline {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.9);
      padding: 12px 30px;
      border-radius: 100px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
    }

    .btn-hero-outline:hover { background: rgba(255,255,255,0.14); }

    .hero-stats { display: flex; gap: 32px; flex-wrap: wrap; }
    .hero-stat { text-align: right; }
    .hero-stat-num { font-size: 1.7rem; font-weight: 900; color: #E0F2FE; line-height: 1; }
    .hero-stat-label { font-size: 0.74rem; color: rgba(255,255,255,0.45); font-weight: 500; margin-top: 2px; }

    /* CSS Phone Mockup */
    .hero-right {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    .phone-wrap { position: relative; }

    .phone-glow {
      position: absolute;
      inset: -30px;
      background: radial-gradient(ellipse at center, rgba(14,165,233,0.25) 0%, transparent 70%);
      border-radius: 50%;
    }

    .phone {
      width: 240px;
      height: 490px;
      background: #0F172A;
      border-radius: 44px;
      border: 6px solid rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 32px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .phone-notch {
      position: absolute;
      top: 14px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 20px;
      background: #0F172A;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 10;
    }

    .phone-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #1E1B4B 0%, #0F172A 100%);
      display: flex;
      flex-direction: column;
      padding: 50px 12px 16px;
      gap: 8px;
    }

    .phone-header { font-size: 0.6rem; font-weight: 700; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-align: center; margin-bottom: 4px; }
    .phone-greeting { text-align: center; margin-bottom: 8px; }
    .phone-greeting-name { font-size: 0.85rem; font-weight: 700; color: white; }
    .phone-greeting-sub { font-size: 0.55rem; color: rgba(255,255,255,0.4); }
    .phone-clock { text-align: center; font-size: 1.8rem; font-weight: 900; color: #38BDF8; line-height: 1; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .phone-date { text-align: center; font-size: 0.5rem; color: rgba(255,255,255,0.35); margin-bottom: 12px; }

    .phone-status-bar {
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .phone-status-dot { width: 6px; height: 6px; border-radius: 50%; background: #10B981; }
    .phone-status-text { font-size: 0.5rem; color: #34D399; font-weight: 700; }

    .phone-btn-row { display: flex; gap: 8px; }
    .phone-btn { flex: 1; border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 0.5rem; font-weight: 700; }
    .phone-btn-in { background: linear-gradient(135deg, #10B981, #059669); color: white; }
    .phone-btn-out { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; }
    .phone-btn-icon { font-size: 0.9rem; display: block; margin-bottom: 2px; }

    .phone-cards { display: flex; gap: 6px; }
    .phone-card { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 7px 5px; text-align: center; }
    .phone-card-num { font-size: 0.8rem; font-weight: 900; color: #38BDF8; }
    .phone-card-label { font-size: 0.4rem; color: rgba(255,255,255,0.35); }

    .phone-nav { margin-top: auto; display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 8px; }
    .phone-nav-item { font-size: 0.9rem; opacity: 0.4; }
    .phone-nav-item.active { opacity: 1; }

    .phone-badge-gps {
      position: absolute;
      bottom: -16px; right: -32px;
      background: linear-gradient(135deg, #EF4444, #DC2626);
      color: white;
      font-size: 0.58rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 16px rgba(239,68,68,0.4);
      white-space: nowrap;
    }

    .phone-badge-offline {
      position: absolute;
      top: 80px; left: -40px;
      background: rgba(15,23,42,0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(16,185,129,0.3);
      color: #34D399;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    /* SECTIONS COMMON */
    section { padding: 96px 24px; }
    .container { max-width: 1160px; margin: 0 auto; }

    .section-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 100px;
      margin-bottom: 14px;
    }

    .badge-purple { background: var(--purple-faint); color: var(--purple); }
    .badge-blue { background: #EFF6FF; color: var(--blue-dark); }
    .badge-green { background: #ECFDF5; color: #065F46; }
    .badge-red { background: #FEF2F2; color: #991B1B; }
    .badge-gold { background: #FFFBEB; color: #92400E; }
    .badge-dark-blue { background: rgba(14,165,233,0.12); color: #38BDF8; }
    .badge-dark-gold { background: rgba(245,158,11,0.15); color: #FCD34D; }

    .section-title { font-size: clamp(1.7rem, 3.5vw, 2.6rem); font-weight: 900; color: var(--text); margin-bottom: 10px; line-height: 1.2; }
    .section-title span { color: var(--purple); }
    .section-sub { font-size: 1rem; color: var(--text-muted); font-weight: 500; max-width: 580px; }
    .section-header { margin-bottom: 56px; }
    .centered { text-align: center; }
    .centered .section-sub { margin: 0 auto; }
    .dark-title { color: white !important; }
    .dark-sub { color: rgba(255,255,255,0.5) !important; }

    /* STATS BAR */
    .stats-bar { background: linear-gradient(135deg, #1E0B4D, #1E3A5F); padding: 0; }
    .stats-inner { max-width: 1160px; margin: 0 auto; padding: 40px 24px; display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 24px; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, #38BDF8, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
    .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.5); font-weight: 500; margin-top: 4px; }
    .stat-sep { width: 1px; height: 48px; background: rgba(255,255,255,0.08); }

    /* PROBLEMS */
    .problems-section { background: #FEF2F2; }
    .problems-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 20px; }
    .problem-card { background: white; border: 1px solid #FECACA; border-right: 4px solid #EF4444; border-radius: var(--radius-sm); padding: 22px; display: flex; gap: 14px; transition: all 0.25s; }
    .problem-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(239,68,68,0.1); }
    .problem-icon { font-size: 1.7rem; flex-shrink: 0; line-height: 1; }
    .problem-card h3 { font-size: 0.95rem; font-weight: 700; color: #991B1B; margin-bottom: 5px; }
    .problem-card p { font-size: 0.83rem; color: #7F1D1D; line-height: 1.6; }

    /* SVG icon wrapper */
    .svg-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .svg-icon svg { display: block; }

    /* GPS SECTION */
    .gps-section { background: #0F172A; }
    .gps-intro { background: linear-gradient(135deg, rgba(14,165,233,0.1), rgba(124,58,237,0.1)); border: 1px solid rgba(14,165,233,0.2); border-radius: var(--radius-sm); padding: 20px 24px; color: rgba(255,255,255,0.7); font-size: 0.95rem; font-weight: 500; line-height: 1.75; margin-bottom: 48px; }
    .gps-intro strong { color: #38BDF8; }
    .gps-layers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 48px; }
    .gps-layer { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: var(--radius-sm); padding: 24px; display: flex; gap: 16px; align-items: flex-start; transition: all 0.3s; }
    .gps-layer:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); transform: translateY(-2px); }
    .gps-num { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 900; color: white; flex-shrink: 0; }
    .gps-layer h3 { font-size: 0.95rem; font-weight: 700; color: white; margin-bottom: 6px; }
    .gps-layer p { font-size: 0.82rem; color: rgba(255,255,255,0.5); line-height: 1.6; }
    .gps-layer-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .gps-extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .gps-extra { background: rgba(14,165,233,0.08); border: 1px solid rgba(14,165,233,0.2); border-radius: var(--radius-sm); padding: 18px 20px; }
    .gps-extra h4 { font-size: 0.88rem; font-weight: 700; color: #38BDF8; margin-bottom: 4px; }
    .gps-extra p { font-size: 0.78rem; color: rgba(255,255,255,0.45); }

    /* OFFLINE */
    .offline-section { background: var(--bg-soft); }
    .offline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; margin-bottom: 56px; }
    .offline-card { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 24px; display: flex; gap: 14px; transition: all 0.25s; }
    .offline-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .offline-card h3 { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 5px; }
    .offline-card p { font-size: 0.83rem; color: var(--text-muted); line-height: 1.6; }
    .offline-svg { width: 44px; height: 44px; background: var(--purple-faint); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--purple); }

    .sync-flow { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; }
    .sync-flow-title { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-align: center; margin-bottom: 28px; letter-spacing: 0.05em; }
    .sync-steps { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; row-gap: 16px; }
    .sync-step { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 110px; }
    .sync-step-icon { width: 52px; height: 52px; background: var(--purple-faint); border: 2px solid var(--purple-mid); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 8px; }
    .sync-step-label { font-size: 0.8rem; font-weight: 700; color: var(--text); }
    .sync-step-sub { font-size: 0.68rem; color: var(--text-light); }
    .sync-arrow { font-size: 1.2rem; color: var(--purple); padding: 0 8px; flex-shrink: 0; }

    /* NOTIFICATIONS */
    .notif-section { background: white; }
    .notif-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 40px; }
    .notif-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; position: relative; overflow: hidden; }
    .notif-card::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 4px; background: var(--notif-color, var(--purple)); }
    .notif-icon-big { font-size: 2rem; margin-bottom: 12px; }
    .notif-card h3 { font-size: 1.05rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .notif-card p { font-size: 0.83rem; color: var(--text-muted); line-height: 1.65; margin-bottom: 16px; }
    .notif-timings { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .notif-timings li { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-muted); }
    .notif-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .notif-tech { background: var(--purple-faint); border: 1px solid var(--purple-mid); border-radius: var(--radius-sm); padding: 20px 24px; }
    .notif-tech-title { font-size: 0.8rem; font-weight: 700; color: var(--purple); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; }
    .notif-tech-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .notif-tech-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 0.85rem; color: var(--purple-dark); }
    .notif-tech-list li::before { content: '⚙'; font-size: 0.75rem; flex-shrink: 0; margin-top: 2px; }

    /* LEAVES */
    .leaves-section { background: var(--bg-soft); }
    .leaves-types { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 48px; }
    .leave-type-chip { display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 100px; font-size: 0.88rem; font-weight: 700; border: 2px solid; }
    .leaves-layout { display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: start; }
    .leave-flow { display: flex; flex-direction: column; gap: 0; position: relative; }
    .leave-flow::before { content: ''; position: absolute; right: 19px; top: 20px; bottom: 20px; width: 2px; background: linear-gradient(180deg, var(--purple), var(--blue)); }
    .leave-step { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 28px; position: relative; }
    .leave-step:last-child { margin-bottom: 0; }
    .leave-step-num { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 900; color: white; flex-shrink: 0; position: relative; z-index: 1; }
    .leave-step-body { flex: 1; padding-top: 6px; }
    .leave-step-body h4 { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .leave-step-body p { font-size: 0.82rem; color: var(--text-muted); line-height: 1.55; }
    .leaves-features-box { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .leaves-features-box h3 { font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 18px; }

    .hrm-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(14,165,233,0.1); border: 1px solid rgba(14,165,233,0.2); color: #38BDF8; font-size: 0.72rem; font-weight: 700; padding: 4px 12px; border-radius: 100px; }

    /* ANIMATIONS */
    .fade-up { opacity: 0; transform: translateY(28px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    .fade-up:nth-child(2) { transition-delay: 0.08s; }

    /* RESPONSIVE */
    @media (max-width: 900px) {

    <div class="footer-grid">
      <div class="footer-col">
        <h3 id="footer-cc-name"></h3>
        <p id="footer-cc-tagline"></p>
      </div>
      <div class="footer-col">
        <h4 id="footer-contact-title"></h4>
        <ul id="footer-contact"></ul>
      </div>
      <div class="footer-col">
        <h4 id="footer-services-title"></h4>
        <ul id="footer-services-list"></ul>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="footer-copy"></span>
      <div class="hrm-badge" id="footer-hrm-badge"></div>
    </div>
  </div>
</footer>

<script>
// ===== HELPERS =====
function svgIcon(inner, size = 20, color = 'currentColor') {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const el = document.getElementById('phone-clock');
  if (el) el.textContent = `${h}:${m}`;
}
setInterval(updateClock, 1000);

// ===== NAVBAR =====
window.addEventListener('scroll', () => {
  document.getElementById('navbar').style.boxShadow =
    window.scrollY > 60 ? '0 2px 24px rgba(0,0,0,0.08)' : 'none';
});

// ===== MAIN BUILD =====
function build() {
  const c = HRM_CONFIG;
  const cc = c.creativeCode;
  const L = c.labels;

  // PAGE TITLE
  document.title = `${c.system.name} — ${c.system.tagline} | ${cc.name}`;

  // NAV
  document.getElementById('nav-cc-name').textContent = cc.name;
  document.getElementById('nav-pill').textContent = L.navPill;

  // HERO
  document.getElementById('hero-badge-text').textContent = c.hero.badge;
  document.getElementById('hero-h1').innerHTML =
    `${c.hero.headline}<br><span class="hl">${c.hero.headlineHighlight}</span>`;
  document.getElementById('hero-sub').textContent = c.hero.sub;
  document.getElementById('hero-cta').textContent = c.hero.cta;
  document.getElementById('hero-cta2').textContent = c.hero.ctaSecondary;
  document.getElementById('phone-badge-gps').textContent = L.phoneFloatingGps;
  document.getElementById('phone-badge-offline').textContent = L.phoneFloatingOffline;

  // Hero stats
  c.stats.forEach(s => {
    const d = document.createElement('div');
    d.className = 'hero-stat';
    d.innerHTML = `<div class="hero-stat-num">${s.num}</div><div class="hero-stat-label">${s.label}</div>`;
    document.getElementById('hero-stats').appendChild(d);
  });

  // Phone mockup (config-driven)
  const pm = L.phoneMockup;
  document.getElementById('phone-screen').innerHTML = `
    <div class="phone-header">${pm.systemName}</div>
    <div class="phone-greeting">
      <div class="phone-greeting-name">${pm.greeting}</div>
      <div class="phone-greeting-sub">${pm.date}</div>
    </div>
    <div class="phone-clock" id="phone-clock">09:00</div>
    <div class="phone-date">${pm.attendanceLabel}</div>
    <div class="phone-status-bar">
      <div class="phone-status-dot"></div>
      <div class="phone-status-text">${pm.gpsStatus}</div>
    </div>
    <div class="phone-btn-row">
      <div class="phone-btn phone-btn-in">
        <span class="phone-btn-icon">✅</span>
        ${pm.btnIn}
      </div>
      <div class="phone-btn phone-btn-out">
        <span class="phone-btn-icon">🚪</span>
        ${pm.btnOut}
      </div>
    </div>
    <div class="phone-cards">
      ${pm.stats.map(s => `
        <div class="phone-card">
          <div class="phone-card-num">${s.num}</div>
          <div class="phone-card-label">${s.label}</div>
        </div>`).join('')}
    </div>
    <div class="phone-nav">
      <div class="phone-nav-item active">🏠</div>
      <div class="phone-nav-item">📅</div>
      <div class="phone-nav-item">🌴</div>
      <div class="phone-nav-item">👥</div>
      <div class="phone-nav-item">👤</div>
    </div>`;

  updateClock();

  // STATS BAR
  c.stats.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'stat-item';
    d.innerHTML = `<div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div>`;
    document.getElementById('stats-inner').appendChild(d);
    if (i < c.stats.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'stat-sep';
      document.getElementById('stats-inner').appendChild(sep);
    }
  });

  // PROBLEMS
  document.getElementById('problems-badge').textContent = L.sections.problems;
  document.getElementById('problems-title').textContent = c.problems.title;
  document.getElementById('problems-sub').textContent = c.problems.subtitle;
  c.problems.items.forEach(p => {
    const d = document.createElement('div');
    d.className = 'problem-card fade-up';
    d.innerHTML = `<div class="problem-icon">${p.icon}</div><div><h3>${p.title}</h3><p>${p.desc}</p></div>`;
    document.getElementById('problems-grid').appendChild(d);
  });

  // GPS
  document.getElementById('gps-badge').textContent = L.sections.gps;
  document.getElementById('gps-title').textContent = c.gps.title;
  document.getElementById('gps-sub').textContent = c.gps.subtitle;
  document.getElementById('gps-intro').innerHTML = c.gps.intro;
  c.gps.layers.forEach(l => {
    const d = document.createElement('div');
    d.className = 'gps-layer fade-up';
    d.innerHTML = `
      <div class="gps-layer-icon" style="background:${l.color}22; color:${l.color}">
        ${svgIcon(l.svg, 22, l.color)}
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="gps-num" style="background:${l.color};width:22px;height:22px;font-size:0.65rem">${l.num}</span>
          <h3 style="margin:0">${l.title}</h3>
        </div>
        <p>${l.desc}</p>
      </div>`;
    document.getElementById('gps-layers-grid').appendChild(d);
  });
  c.gps.extras.forEach(e => {
    const d = document.createElement('div');
    d.className = 'gps-extra fade-up';
    d.innerHTML = `<h4>${e.title}</h4><p>${e.desc}</p>`;
    document.getElementById('gps-extras').appendChild(d);
  });

  // OFFLINE
  document.getElementById('offline-badge').textContent = L.sections.offline;
  document.getElementById('offline-title').textContent = c.offline.title;
  document.getElementById('offline-sub').textContent = c.offline.subtitle;
  document.getElementById('sync-flow-title').textContent = L.syncFlowTitle;
  c.offline.features.forEach(f => {
    const d = document.createElement('div');
    d.className = 'offline-card fade-up';
    d.innerHTML = `
      <div class="offline-svg">${svgIcon(f.svg, 20)}</div>
      <div><h3>${f.title}</h3><p>${f.desc}</p></div>`;
    document.getElementById('offline-grid').appendChild(d);
  });
  c.offline.syncSteps.forEach((step, i) => {
    const d = document.createElement('div');
    d.className = 'sync-step';
    d.innerHTML = `
      <div class="sync-step-icon">${step.icon}</div>
      <div class="sync-step-label">${step.label}</div>
      <div class="sync-step-sub">${step.sub}</div>`;
    document.getElementById('sync-steps').appendChild(d);
    if (i < c.offline.syncSteps.length - 1) {
      const a = document.createElement('div');
      a.className = 'sync-arrow';
      a.textContent = '←';
      document.getElementById('sync-steps').appendChild(a);
    }
  });

  // NOTIFICATIONS
  document.getElementById('notif-badge').textContent = L.sections.notifications;
  document.getElementById('notif-title').textContent = c.notifications.title;
  document.getElementById('notif-sub').textContent = c.notifications.subtitle;
  document.getElementById('notif-tech-title').textContent = L.notifTechTitle;
  c.notifications.items.forEach(n => {
    const d = document.createElement('div');
    d.className = 'notif-card fade-up';
    d.style.setProperty('--notif-color', n.color);
    d.innerHTML = `
      <div class="notif-icon-big">${n.icon}</div>
      <h3>${n.title}</h3>
      <p>${n.desc}</p>
      <ul class="notif-timings">
        ${n.timings.map(t => `<li><span class="notif-dot" style="background:${n.color}"></span>${t}</li>`).join('')}
      </ul>`;
    document.getElementById('notif-grid').appendChild(d);
  });
  c.notifications.tech.forEach(t => {
    const li = document.createElement('li');
    li.textContent = t;
    document.getElementById('notif-tech-list').appendChild(li);
  });

  // LEAVES
  document.getElementById('leaves-badge').textContent = L.sections.leaves;
  document.getElementById('leaves-title').textContent = c.leaves.title;
  document.getElementById('leaves-sub').textContent = c.leaves.subtitle;
  document.getElementById('leaves-features-box-title').textContent = L.leavesFeaturesBoxTitle;
  c.leaves.types.forEach(t => {
    const d = document.createElement('div');
    d.className = 'leave-type-chip';
    d.style.cssText = `color:${t.color};border-color:${t.color}30;background:${t.color}10`;
    d.innerHTML = `${t.icon} ${t.name}`;
    document.getElementById('leaves-types').appendChild(d);
  });
  c.leaves.flow.forEach(step => {
    const d = document.createElement('div');
    d.className = 'leave-step fade-up';
    d.innerHTML = `
      <div class="leave-step-num" style="background:${step.color}">${step.step}</div>
      <div class="leave-step-body"><h4>${step.title}</h4><p>${step.desc}</p></div>`;
    document.getElementById('leave-flow').appendChild(d);
  });
  c.leaves.features.forEach(f => {
    const li = document.createElement('li');
    li.textContent = f;
    document.getElementById('leaves-feature-list').appendChild(li);
  });

  // PAYROLL
  document.getElementById('payroll-badge').textContent = L.sections.payroll;
  document.getElementById('payroll-title').textContent = c.payroll.title;
  document.getElementById('payroll-sub').textContent = c.payroll.subtitle;
  document.getElementById('payroll-chart-title').textContent = L.payrollChartTitle;
  c.payroll.components.forEach(comp => {
    const d = document.createElement('div');
    d.className = 'payroll-bar-row';
    d.innerHTML = `
      <div class="payroll-bar-label">
        <span>${comp.label}</span><span>${comp.pct}٪</span>
      </div>
      <div class="payroll-bar-track">
        <div class="payroll-bar-fill" style="width:${comp.pct}%;background:${comp.color}"></div>
      </div>`;
    document.getElementById('payroll-bars').appendChild(d);
  });
  c.payroll.features.forEach(f => {
    const d = document.createElement('div');
    d.className = 'payroll-feat fade-up';
    d.innerHTML = `
      <div class="payroll-feat-svg">${svgIcon(f.svg, 20)}</div>
      <div><h3>${f.title}</h3><p>${f.desc}</p></div>`;
    document.getElementById('payroll-features').appendChild(d);
  });

  // BREAKS
  document.getElementById('breaks-badge').textContent = L.sections.breaks;
  document.getElementById('breaks-title').textContent = c.breaks.title;
  document.getElementById('breaks-sub').textContent = c.breaks.subtitle;
  c.breaks.features.forEach(f => {
    const d = document.createElement('div');
    d.className = 'break-card fade-up';
    d.innerHTML = `<div class="break-svg">${svgIcon(f.svg, 22)}</div><h3>${f.title}</h3><p>${f.desc}</p>`;
    document.getElementById('breaks-grid').appendChild(d);
  });

  // WEB DASHBOARD
  document.getElementById('web-badge').textContent = L.sections.webDashboard;
  document.getElementById('web-title').textContent = c.webDashboard.title;
  document.getElementById('web-sub').textContent = c.webDashboard.subtitle;

  // Desktop mockup (config-driven)
  const dm = L;
  document.getElementById('desktop-mockup').innerHTML = `
    <div class="desktop-bar">
      <div class="desktop-dot" style="background:#EF4444"></div>
      <div class="desktop-dot" style="background:#F59E0B"></div>
      <div class="desktop-dot" style="background:#10B981"></div>
      <div class="desktop-url">🔒 ${dm.desktopUrl}</div>
    </div>
    <div class="desktop-screen">
      <div class="desktop-sidebar">
        <div class="desktop-sidebar-logo">${dm.desktopSystemName}</div>
        ${dm.desktopNavItems.map((item, i) =>
          `<div class="desktop-nav-item${i === 0 ? ' active' : ''}">${item}</div>`
        ).join('')}
      </div>
      <div class="desktop-content">
        <div class="desktop-kpi-row">
          ${dm.desktopKpis.map(k => `
            <div class="desktop-kpi">
              <div class="desktop-kpi-num" style="color:${k.color}">${k.num}</div>
              <div class="desktop-kpi-label">${k.label}</div>
            </div>`).join('')}
        </div>
        <div class="desktop-chart-area">
          <div class="desktop-chart-header">${dm.desktopChartTitle}</div>
          <div class="desktop-bars">
            ${['#7C3AED','#0EA5E9','#10B981','#F59E0B','#7C3AED','#EF4444','#0EA5E9']
              .map((col, i) => {
                const heights = [75,88,92,65,98,45,80];
                return `<div class="desktop-bar-col" style="background:${col};height:${heights[i]}%"></div>`;
              }).join('')}
          </div>
        </div>
      </div>
    </div>`;

  c.webDashboard.features.forEach(f => {
    const d = document.createElement('div');
    d.className = 'web-feat-card fade-up';
    d.innerHTML = `
      <div class="web-feat-svg">${svgIcon(f.svg, 20)}</div>
      <div><h3>${f.title}</h3><p>${f.desc}</p></div>`;
    document.getElementById('web-features-grid').appendChild(d);
  });

  // MOBILE APP
  document.getElementById('app-badge').textContent = L.sections.mobileApp;
  document.getElementById('app-title').textContent = c.mobileApp.title;
  document.getElementById('app-sub').textContent = c.mobileApp.subtitle;
  document.getElementById('app-spec-title').textContent = L.appTechSpecsTitle;
  document.getElementById('app-screens-label').textContent = L.appScreensTitle;
  c.mobileApp.specs.forEach(s => {
    const li = document.createElement('li');
    li.className = 'app-spec-item';
    li.innerHTML = `<span class="app-spec-key">${s.label}</span><span class="app-spec-val">${s.value}</span>`;
    document.getElementById('app-spec-list').appendChild(li);
  });
  L.appPlatforms.forEach(p => {
    const d = document.createElement('div');
    d.className = 'platform-badge';
    d.innerHTML = `${p.includes('iOS') ? '🍎' : '🤖'} ${p}`;
    document.getElementById('app-badges').appendChild(d);
  });
  c.mobileApp.screens.forEach(s => {
    const d = document.createElement('div');
    d.className = 'screen-chip fade-up';
    d.innerHTML = `${s.icon} ${s.name}`;
    document.getElementById('app-screens-grid').appendChild(d);
  });

  // ALL FEATURES
  document.getElementById('feat-badge').textContent = L.sections.allFeatures;
  document.getElementById('feat-title').textContent = c.allFeatures.title;
  document.getElementById('feat-sub').textContent = c.allFeatures.subtitle;
  c.allFeatures.items.forEach(f => {
    const d = document.createElement('div');
    d.className = 'feat-chip fade-up';
    d.innerHTML = `<span class="feat-chip-icon">${f.icon}</span>${f.label}`;
    document.getElementById('features-mega-grid').appendChild(d);
  });

  // ROLES — COMPARISON TABLE
  document.getElementById('roles-badge').textContent = L.sections.roles;
  document.getElementById('roles-title').textContent = c.roles.title;
  document.getElementById('roles-sub').textContent = c.roles.subtitle;

  const table = document.getElementById('roles-table');

  // thead
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');

  const th0 = document.createElement('th');
  th0.textContent = 'الصلاحية';
  th0.style.cssText = 'text-align:right;min-width:220px;';
  headerRow.appendChild(th0);

  c.roles.columns.forEach(col => {
    const th = document.createElement('th');
    th.innerHTML = `
      <span class="col-icon">${col.icon}</span>
      <span class="col-name-ar" style="color:${col.color}">${col.nameAr}</span><br>
      <span class="col-name-en">${col.label}</span>`;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  // tbody
  const tbody = document.createElement('tbody');
  c.roles.permissions.forEach(perm => {
    const tr = document.createElement('tr');
    const tdLabel = document.createElement('td');
    tdLabel.textContent = perm.label;
    tr.appendChild(tdLabel);

    c.roles.columns.forEach(col => {
      const hasPermission = perm[col.key];
      const td = document.createElement('td');
      if (hasPermission) {
        td.innerHTML = `
          <span class="role-check-cell role-check-yes">
            <svg class="check-svg" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${col.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>`;
      } else {
        td.innerHTML = `
          <span class="role-check-cell role-check-no">
            <svg class="check-svg" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </span>`;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  // FOOTER
  document.getElementById('footer-cta-badge').textContent = L.footerCtaBadge;
  document.getElementById('footer-cta-title').textContent = L.footerCtaTitle;
  document.getElementById('footer-cta-sub').textContent = L.footerCtaSub;
  document.getElementById('footer-btns').innerHTML = `
    <a href="tel:${cc.phone}" class="btn-footer btn-footer-main">📞 اتصل بنا الآن</a>
    <a href="mailto:${cc.email}" class="btn-footer btn-footer-ghost">✉ راسلنا</a>`;
  document.getElementById('footer-cc-name').textContent = cc.name;
  document.getElementById('footer-cc-tagline').textContent = cc.tagline;
  document.getElementById('footer-contact-title').textContent = L.footerContactTitle;
  document.getElementById('footer-contact').innerHTML = `
    <li>📞 ${cc.phone}</li>
    <li>✉ ${cc.email}</li>
    <li>🌐 ${cc.website}</li>
    <li>📍 ${cc.address}</li>`;
  document.getElementById('footer-services-title').textContent = L.footerServicesTitle;
  document.getElementById('footer-services-list').innerHTML =
    L.footerServices.map(s => `<li>${s}</li>`).join('');
  document.getElementById('footer-copy').textContent =
    `© ${new Date().getFullYear()} ${cc.name} — ${L.footerRights}`;
  document.getElementById('footer-hrm-badge').textContent = L.footerHrmBadge;
}

// ===== SCROLL ANIMATIONS =====
function initAnims() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.08, rootMargin: '0px 0px -32px 0px' });
  document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
}

document.addEventListener('DOMContentLoaded', () => {
  build();
  setTimeout(initAnims, 120);
});
</script>
</body>
</html>
